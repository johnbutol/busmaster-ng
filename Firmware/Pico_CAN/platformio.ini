; BUSMASTER-NG CAN interface firmware for a Raspberry Pi Pico 2 (3 channels) or Pico (2 channels)
; PlatformIO project:
;   build:  pio run -e pico2          (or -e pico)
;   load:   pio run -e pico2 -t upload
;           the first time, hold BOOTSEL while plugging the board
;
; The Arduino core is arduino-pico (Earle Philhower), through the platform of Max Gerhardt:
; the platform of PlatformIO itself does not know the RP2350.
; The CAN protocol is done by can2040 (Kevin O'Connor, GPL v3), fetched by PlatformIO.
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
lib_deps = https://github.com/KevinOConnor/can2040.git#v1.7.0
build_flags =
    -I ../../Sources/BUSMASTER/CAN_Teensy
    -Wall

[env:pico2]
board = rpipico2

[env:pico]
board = rpipico
